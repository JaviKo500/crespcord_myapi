; Local-only overrides, loaded after 99-crespcord.ini.
; PHP mail() hands the message to msmtp, which delivers to Mailpit.
sendmail_path = "/usr/bin/msmtp -t -i"
; Edited files must be picked up on the next request.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Report everything to the log, deprecations included (production masks
; E_DEPRECATED and E_STRICT). The log must stay empty: see docs/desarrollo-local.md.
error_reporting = E_ALL
