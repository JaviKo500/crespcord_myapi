# Local only. The whole repository is bind-mounted as the module directory, so
# it also carries files production never receives (scripts/, tests/, vendor/,
# .env, local deploy targets). Nothing of that may be reachable over HTTP,
# least of all when the port is opened to the LAN for a physical device:
# only the three asset directories scripts/deploy.sh ships are served.
<Directory /var/www/html/sites/all/modules/myapi>
    Require all denied
</Directory>
<DirectoryMatch "^/var/www/html/sites/all/modules/myapi/(css|js|assets)(/|$)">
    Require all granted
</DirectoryMatch>
